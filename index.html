
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taller - Juego de la Serpiente</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>

    <main class="contenedor">
        <h1>🐍 Juego de la Serpiente</h1>
        <p>Usa los botones para cambiar la dirección.</p>

        <div class="marcador">
            <span>Puntaje: <strong id="puntaje">0</strong></span>
            <span id="estado">Juego detenido</span>
        </div>

        <canvas id="canvasJuego" width="500" height="500"></canvas>

        <div class="controles">
            <button class="direccion" data-direccion="arriba">⬆️ Arriba</button>

            <div class="fila">
                <button class="direccion" data-direccion="izquierda">⬅️ Izquierda</button>
                <button class="direccion" data-direccion="abajo">⬇️ Abajo</button>
                <button class="direccion" data-direccion="derecha">➡️ Derecha</button>
            </div>
        </div>

        <div class="acciones">
            <button id="btnIniciar">▶ Iniciar</button>
            <button id="btnPausar">⏸ Pausar</button>
            <button id="btnReiniciar">🔄 Reiniciar</button>
        </div>

        <p class="ayuda">También puedes usar las flechas del teclado.</p>
    </main>

</body>
</html>
